[project]
name = "klarix-semantic-benchmark"
version = "0.1.0"
description = "Benchmark of semantic-layer stacks answering the same business questions through an LLM agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "db-dtypes",
    "duckdb",
    "google-cloud-bigquery",
    "google-genai",
    "httpx",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "pyjwt",
    "python-dotenv",
    "pyyaml",
    "rich",
    "typer",
]

[dependency-groups]
dev = ["pytest", "ruff"]
project2 = [
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "dbt-metricflow==0.15.0",
    "metricflow==0.213.0",
]

[tool.uv]
default-groups = ["dev", "project2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # the plan's code blocks are illustrative, not source

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
