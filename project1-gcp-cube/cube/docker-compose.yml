# Local Cube Core instance for Project 1 (DEV_PLAN section 10.1). Single container --
# dev mode ships its own embedded Cube Store, so no separate cubestore service is
# needed for local development. Values come from the environment (see up.py, which
# loads config/settings.yaml + .env and passes them through); this file is never
# invoked with a bare `docker compose up` from this directory.
services:
  cube:
    image: cubejs/cube:v1.7.46
    ports:
      - "4000:4000"
    environment:
      - CUBEJS_DEV_MODE=true
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET}
      - CUBEJS_DB_TYPE=bigquery
      - CUBEJS_DB_BQ_PROJECT_ID=${GCP_PROJECT_ID}
      - CUBEJS_DB_BQ_KEY_FILE=/cube/conf/service-account.json
      - CUBEJS_DB_BQ_LOCATION=${BQ_LOCATION}
    volumes:
      - ./model:/cube/conf/model:ro
      - ${CUBE_SA_KEY_PATH}:/cube/conf/service-account.json:ro
